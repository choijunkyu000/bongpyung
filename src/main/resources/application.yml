# =========================================================
# 🏠 공통 설정 (local / prod 공통)
# =========================================================
server:
  port: 8080
  servlet:
    session:
      timeout: 5m

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul   # ✅ JDBC <-> DB 타임존 고정
  thymeleaf:
    cache: false                  # (prod에선 true 권장)
  jackson:
    time-zone: Asia/Seoul         # ✅ JSON 직렬화/역직렬화 타임존

  # [선택] 폼/쿼리 파라미터 기본 포맷 통일(바인딩 시)
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

logging:
  level:
    root: INFO                    # ✅ 위치 수정 (file 아래가 아닌 여기)
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /home/ubuntu/work/deploy/backend/log/app.log

# =========================================================
# 💻 Local
