  config:
    activate.on-profile: local

  datasource:
    url: jdbc:postgresql://ec2-52-78-234-30.ap-northeast-2.compute.amazonaws.com:5432/attendance?currentSchema=web&options=-c%20TimeZone=Asia/Seoul
    username: attendance
    password: "qhdvud2025@)@%"
