# =========================================================
# 🏠 공통 설정 (local / prod 공통)
# =========================================================
server:
  port: 8080
  servlet:
    session:
      timeout: 5m

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul  # JDBC 레벨 Timestamp 교환 시 기준

  thymeleaf:
    cache: false

  jackson:
    time-zone: Asia/Seoul    # JSON 직렬화/역직렬화

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Seoul} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: /home/ubuntu/work/deploy/backend/log/app.log  # <- 여기를 표준으로!
    level:
      root: INFO

