<!-- src/main/resources/templates/fragments/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="siteHeader">
    <div class="header">
        <div class="header__row">
            <div class="header__brand">봉편면옥 출퇴근시스템</div>
            <nav style="display:flex; gap:12px; align-items:center;">
                <a class="header__link" th:href="@{/account/password}">비밀번호 변경</a>
                <a class="header__link" th:href="@{/logout}">로그아웃</a>
            </nav>
        </div>
    </div>

    <script>
        // 세션 만료 시 처리(선택)
        fetch('/api/session/status')
            .then(r => r.ok ? r.json() : {active:true})
            .then(d => { if (d && d.active === false) location.href = '/login?expired'; })
            .catch(() => {});

        // 날짜 포맷 함수 (옵션에 따라 시:분:초 포함)
        function formatDate(str, includeTime = false) {
            try {
                const d = new Date(str);
                const pad = n => n.toString().padStart(2, '0');
                const datePart = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
                if (!includeTime) return datePart;

                const timePart = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                return `${datePart} ${timePart}`;
            } catch {
                return str;
            }
        }

    </script>


</header>
</body>
</html>
