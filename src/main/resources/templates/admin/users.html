<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>사용자관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="container">
<header class="header">
    <div class="header__row">
        <div>
            <div class="header__brand">Bongpyung Admin</div>
            <div class="user" th:text="${#authentication?.name}">admin</div>
        </div>
        <a class="header__link" href="/logout">로그아웃</a>
    </div>
</header>

<h1>사용자관리</h1>

<!-- 등록 폼 -->
<div class="card card--tight">
    <div class="form-grid">
        <input id="f-userId" placeholder="아이디" class="input full"/>
        <input id="f-displayName" placeholder="이름" class="input full"/>
        <select id="f-role" class="input full">
            <option value="USER">USER (일반 사용자)</option>
            <option value="ADMIN">ADMIN (관리자)</option>
        </select>
        <input id="f-tempPass" placeholder="임시 비밀번호 (기본 asdf1234)" class="input full"/>
        <div class="form-actions full">
            <button class="btn btn--primary btn--sm" id="btnCreate">등록</button>
            <button class="btn btn--sm" id="btnReload">새로고침</button>
            <label class="chk" style="display:flex;align-items:center;gap:6px;">
                <input type="checkbox" id="f-includeInactive" style="width:auto;"/> 비활성 포함
            </label>
        </div>
    </div>
    <div class="muted" style="margin-top:8px">등록 시 계정은 활성화되고, 첫 로그인에 비밀번호 변경을 유도합니다.</div>
    <div id="msg" class="muted"></div>
</div>

<!-- 목록 -->
<div class="card card--tight">
    <div id="listWrap" style="overflow-x:auto;">
        <table class="table">
            <thead>
            <tr>
                <th>이름</th>
                <th>아이디</th>
                <th>역할</th>
                <th>활성</th>
                <th>작업</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
    const tbody = document.getElementById('tbody');
    const msg = document.getElementById('msg');
    const fUser = document.getElementById('f-userId');
    const fName = document.getElementById('f-displayName');
    const fRole = document.getElementById('f-role');
    const fPass = document.getElementById('f-tempPass');
    const chkInactive = document.getElementById('f-includeInactive');

    async function api(method, url, body){
        const token  = document.querySelector('meta[name="_csrf"]')?.content;
        const header = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
        const opt = { method, headers: { 'Content-Type': 'application/json' } };
        if (token) opt.headers[header] = token;
        if (body) opt.body = JSON.stringify(body);
        const r = await fetch(url, opt);
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        return r.json();
    }

    function cell(label, inner){
        const td = document.createElement('td');
        td.setAttribute('data-th', label);
        td.innerHTML = inner;
        return td;
    }

    async function load(){
        const includeInactive = chkInactive.checked ? 'true' : 'false';
        const data = await api('GET', `/admin/api/users?includeInactive=${includeInactive}`);
        tbody.innerHTML = '';
        if(!data.ok){ tbody.innerHTML = '<tr><td data-th="오류" colspan="5">로드 실패</td></tr>'; return; }

        for(const row of data.rows){
            const tr = document.createElement('tr');
            tr.appendChild(cell('이름', `<input data-id="${row.id}" data-k="displayName" class="input" value="${row.displayName??''}" />`));
            tr.appendChild(cell('아이디', `<div class="muted">${row.userId}</div>`));
            tr.appendChild(cell('역할', `
        <select data-id="${row.id}" data-k="role" class="input">
          <option value="USER" ${row.role==='USER'?'selected':''}>USER</option>
          <option value="ADMIN" ${row.role==='ADMIN'?'selected':''}>ADMIN</option>
        </select>
      `));
            tr.appendChild(cell('활성', `
        <select data-id="${row.id}" data-k="useYn" class="input">
          <option value="true" ${row.useYn?'selected':''}>활성</option>
          <option value="false" ${!row.useYn?'selected':''}>비활성</option>
        </select>
      `));
            tr.appendChild(cell('작업', `
        <div class="td-actions">
          <button data-act="save" data-id="${row.id}" class="btn btn--primary btn--sm">저장</button>
          <button data-act="delete" data-id="${row.id}" class="btn btn--danger btn--sm">삭제</button>
          <button data-act="reset" data-id="${row.id}" class="btn btn--sm">비번초기화</button>
        </div>
      `));
            tbody.appendChild(tr);
        }
    }

    document.getElementById('btnReload').addEventListener('click', load);
    document.getElementById('btnCreate').addEventListener('click', async () => {
        const userId = fUser.value.trim(), displayName = fName.value.trim(),
            role = fRole.value, tempPassword = fPass.value.trim();
        if(!userId || !displayName){ msg.textContent='아이디/이름은 필수입니다.'; return; }
        const res = await api('POST','/admin/api/users',{ userId, displayName, role, tempPassword });
        if(res.ok){ fUser.value=''; fName.value=''; fPass.value=''; alert('등록 완료'); load(); }
        else{ alert(res.message || '등록 실패'); }
    });

    tbody.addEventListener('click', async (e) => {
        const btn = e.target.closest('button'); if(!btn) return;
        const id = btn.dataset.id, act = btn.dataset.act;

        if(act === 'save'){
            const rowEl = btn.closest('tr');
            const payload = {};
            rowEl.querySelectorAll('input[data-k],select[data-k]').forEach(el => {
                const k = el.dataset.k; let v = el.value;
                if(k==='useYn') v = (v === 'true');
                payload[k] = v;
            });
            const res = await api('PUT', `/admin/api/users/${id}`, payload);
            if(res.ok){ alert('저장되었습니다.'); load(); }
            else{ alert(res.message || '저장 실패'); }
        }

        if(act === 'delete'){
            if(!confirm('정말 비활성 처리하시겠습니까?')) return;
            const res = await api('DELETE', `/admin/api/users/${id}`);
            if(res.ok){ load(); } else { alert(res.message || '삭제 실패'); }
        }

        if (act === 'reset') {
            let pw = prompt('새 임시 비밀번호를 입력하세요 (미입력 시 기본: asdf1234)', '');
            if (pw === null) return;
            pw = (pw || '').trim();
            const body = pw ? { password: pw } : {};
            const res = await api('POST', `/admin/api/users/${id}/reset-password`, body);
            if (res.ok) { alert(`임시 비밀번호가 설정되었습니다.${pw ? '' : ' (기본 asdf1234)'}`); }
            else { alert(res.message || '초기화 실패'); }
        }
    });

    load();
</script>
</body>
</html>
