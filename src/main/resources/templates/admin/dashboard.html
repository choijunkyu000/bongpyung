<!-- src/main/resources/templates/admin/dashboard.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>관리자 대시보드</title>
    <style>
        :root{
            --bg:#f8fafc; --card:#ffffff; --border:#e5e7eb; --text:#0f172a; --muted:#64748b; --primary:#2563eb;
        }
        @media (prefers-color-scheme: dark){
            :root{ --bg:#0b1220; --card:#0f172a; --border:#1f2a44; --text:#e5e7eb; --muted:#94a3b8; --primary:#3b82f6; }
        }
        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
            margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;
            background:var(--bg); color:var(--text);
            padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
        }
        header{
            background:var(--primary); color:#fff; padding:14px 16px; border-radius:14px;
            position:sticky; top:0; z-index:10; margin:10px 0 14px;
        }
        .h-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .brand{ font-weight:800; letter-spacing:.2px; }
        .user{ font-size:14px; opacity:.9; }
        .logout{ color:#fff; text-decoration:underline; font-size:14px; white-space:nowrap; }
        h1{ margin:0; font-size:20px; }
        .grid{
            display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
        }
        @media (max-width:520px){ .grid{ grid-template-columns:1fr; } }
        .card{
            background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px;
            box-shadow:0 6px 20px rgba(0,0,0,.05);
            display:flex; flex-direction:column; justify-content:space-between; min-height:140px;
        }
        .card h3{ margin:6px 0 8px; font-size:18px; }
        .card p{ margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.5; }
        .btn{
            display:block; width:100%; text-align:center; padding:14px 16px;
            border-radius:12px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; font-size:16px;
            touch-action:manipulation;
        }
        .row{ display:flex; gap:10px; }
        footer{ margin:16px 0 4px; color:var(--muted); font-size:12px; text-align:center; }
    </style>
</head>
<body>

<!-- 공통 헤더 (fragments/header.html 을 쓰고 있다면 아래 한 줄로 대체 가능)
     <div th:replace="fragments/header :: siteHeader"></div> -->
<header>
    <div class="h-row">
        <div>
            <div class="brand">Bongpyung Admin</div>
            <div class="user" th:text="${#authentication?.name}">admin</div>
        </div>
        <a class="logout" href="/logout">로그아웃</a>
    </div>
</header>

<h1>관리자 대시보드</h1>
<p style="color:var(--muted); margin:6px 2px 16px;">관리 메뉴를 선택하세요.</p>

<section class="grid">
    <!-- 출결관리 -->
    <article class="card">
        <div>
            <h3>출결관리</h3>
            <p>사원 출근·퇴근 기록 조회/수정, 기간별 검색을 수행합니다.</p>
        </div>
        <a class="btn" href="/admin/attendance">이동</a>
    </article>

    <!-- 사용자관리 -->
    <article class="card">
        <div>
            <h3>사용자관리</h3>
            <p>사용자 추가/비활성화, 권한(ADMIN/USER) 변경을 수행합니다.</p>
        </div>
        <a class="btn" href="/admin/users">이동</a>
    </article>
</section>

<footer>© <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Bongpyung</footer>

<script>
    // 모바일 키보드/탭 반응 개선용: iOS 이슈 완화
    document.addEventListener('touchstart', function(){}, {passive:true});
</script>
</body>
</html>
