<!-- src/main/resources/templates/admin/dashboard.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>관리자 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="container">

<!-- 공통 헤더 -->
<div th:replace="fragments/header :: siteHeader"></div>

<h1>관리자 대시보드</h1>
<p class="muted" style="margin:6px 2px 16px;">관리 메뉴를 선택하세요.</p>

<!-- 카드 그리드 -->
<section class="grid">
    <!-- 출결관리 -->
    <article class="card card--tight">
        <div>
            <h2>출결관리</h2>
            <p class="muted">사원 출근·퇴근 기록 조회/수정, 기간별 검색을 수행합니다.</p>
        </div>
        <a class="btn btn--primary btn--block" href="/admin/attendance">이동</a>
    </article>

    <!-- 사용자관리 -->
    <article class="card card--tight">
        <div>
            <h2>사용자관리</h2>
            <p class="muted">사용자 추가/비활성화, 권한(ADMIN/USER) 변경을 수행합니다.</p>
        </div>
        <a class="btn btn--primary btn--block" href="/admin/users">이동</a>
    </article>
</section>

<footer class="muted" style="margin:16px 0 4px; text-align:center;">
    © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Bongpyung
</footer>

<script>
    // 모바일 터치 환경 개선
    document.addEventListener('touchstart', function(){}, {passive:true});
</script>
</body>
</html>
