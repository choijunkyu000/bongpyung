<!-- src/main/resources/templates/admin/user_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>사용자 목록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="container">

<!-- 공통 헤더 -->
<div th:replace="fragments/header :: siteHeader"></div>

<h1>사용자 관리</h1>

<!-- 검색 영역 -->
<div class="card card--tight" style="margin-bottom:18px;">
    <div class="form-grid">
        <input id="searchUserId" class="input" placeholder="아이디 검색">
        <input id="searchDisplayName" class="input" placeholder="이름 검색">
        <input id="searchDate" class="input" type="date">
        <button id="btnSearch" class="btn btn--primary btn--block btn--sm full">검색</button>
    </div>
</div>

<!-- 목록 영역 -->
<div class="card">
    <div id="listWrap" style="overflow-x:auto;">
        <table class="table">
            <thead>
            <tr>
                <th>이름</th>
                <th>아이디</th>
                <th>역할</th>
                <th>활성</th>
                <th>최근 출근</th>
                <th>최근 퇴근</th>
                <th>작업</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
    const tbody = document.getElementById('tbody');
    const fUserId = document.getElementById('searchUserId');
    const fName = document.getElementById('searchDisplayName');
    const fDate = document.getElementById('searchDate');

    // 오늘 날짜 기본 세팅
    const today = new Date().toISOString().split('T')[0];
    fDate.value = today;

    async function api(method, url, body) {
        const token = document.querySelector('meta[name="_csrf"]')?.content;
        const header = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
        const opt = { method, headers: { 'Content-Type': 'application/json' } };
        if (token) opt.headers[header] = token;
        if (body) opt.body = JSON.stringify(body);
        const r = await fetch(url, opt);
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        return r.json();
    }

    function cell(label, inner) {
        const td = document.createElement('td');
        td.setAttribute('data-th', label);
        td.innerHTML = inner;
        return td;
    }

    async function load() {
        const userId = fUserId.value.trim();
        const displayName = fName.value.trim();
        const date = fDate.value;
        const query = new URLSearchParams({ userId, displayName, date }).toString();

        const data = await api('GET', `/admin/api/users/list?${query}`);
        tbody.innerHTML = '';

        if (!data.ok || !data.rows?.length) {
            tbody.innerHTML = '<tr><td data-th="결과 없음" colspan="7" class="muted">데이터가 없습니다.</td></tr>';
            return;
        }

        // 기존 for문 수정
        for (const row of data.rows) {
            const tr = document.createElement('tr');
            tr.appendChild(cell('이름', row.displayName ?? ''));
            tr.appendChild(cell('아이디', row.userId ?? ''));
            tr.appendChild(cell('역할', row.role ?? ''));
            tr.appendChild(cell('활성', row.useYn ? '활성' : '비활성'));
            tr.appendChild(cell('최근 출근', formatDateTime(row.lastCheckIn)));
            tr.appendChild(cell('최근 퇴근', formatDateTime(row.lastCheckOut)));
            tr.appendChild(cell('작업', `
        <button data-id="${row.id}" class="btn btn--sm btn--primary">수정</button>
    `));
            tbody.appendChild(tr);
        }
    }

    // 날짜 포맷터 (ISO → yyyy-MM-dd HH:mm:ss)
    function formatDateTime(dt) {
        if (!dt) return '-';
        const d = new Date(dt);
        if (isNaN(d.getTime())) return dt; // 변환 실패 시 원본 표시
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
    }

    // 검색 이벤트
    document.getElementById('btnSearch').addEventListener('click', load);

    // 수정 클릭 → 상세 페이지 이동
    tbody.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const id = btn.dataset.id;
        window.location.href = `/admin/users/${id}`;
    });

    // 초기 로드
    load();
</script>

</body>
</html>
