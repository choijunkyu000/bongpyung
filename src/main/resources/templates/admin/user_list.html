<!-- src/main/resources/templates/admin/user_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>사용자 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="container">

<!-- 공통 헤더 -->
<div th:replace="fragments/header :: siteHeader"></div>

<h1>사용자 관리</h1>
<p class="muted">사용자 목록을 조회하고 수정할 수 있습니다.</p>

<div class="card">
    <div class="form-grid">
        <div>
            <label for="searchUserId">아이디</label>
            <input id="searchUserId" class="input" type="text" placeholder="user_id로 검색" />
        </div>
        <div>
            <label for="searchDisplayName">이름</label>
            <input id="searchDisplayName" class="input" type="text" placeholder="display_name으로 검색" />
        </div>
        <!--
        <div>
            <label for="searchDate">날짜</label>
            <input id="searchDate" class="input" type="date" />
        </div>
        -->
        <div class="form-actions">
            <button id="btnSearch" class="btn btn--primary">검색</button>
        </div>
    </div>
</div>

<div class="card" style="margin-top:12px;">
    <table class="table" id="userTable">
        <thead>
        <tr>
            <th>이름</th>
            <th>아이디</th>
            <th>역할</th>
            <th>활성</th>
            <th>최근 출근</th>
            <th>최근 퇴근</th>
            <th>생성일</th> <!-- ✅ 추가 -->
            <th>수정일</th> <!-- ✅ 추가 -->
            <th>작업</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const userIdInput = document.getElementById('searchUserId');
    const nameInput = document.getElementById('searchDisplayName');
    //const dateInput = document.getElementById('searchDate');
    const btnSearch = document.getElementById('btnSearch');

    // 기본 날짜를 오늘로 설정
    const now = new Date();
    //dateInput.value = now.toISOString().substring(0, 10);

    btnSearch.addEventListener('click', loadUsers);

    async function loadUsers() {
        const params = new URLSearchParams({
            userId: userIdInput.value.trim()
            ,displayName: nameInput.value.trim()
            //,date: dateInput.value
        });
        const r = await fetch('/admin/api/users/list?' + params.toString());
        const data = await r.json();

        const tbody = document.querySelector('#userTable tbody');
        tbody.innerHTML = '';

        if (!data.ok) {
            alert('데이터를 불러오지 못했습니다.');
            return;
        }

        for (const row of data.rows) {
            const tr = document.createElement('tr');
            tr.appendChild(cell('이름', row.displayName ?? ''));
            tr.appendChild(cell('아이디', row.userId ?? ''));
            tr.appendChild(cell('역할', row.role ?? ''));
            tr.appendChild(cell('활성', row.useYn ? '활성' : '비활성'));
            tr.appendChild(cell('최근 출근', row.lastCheckIn ? formatDateTime(row.lastCheckIn) : '-'));
            tr.appendChild(cell('최근 퇴근', row.lastCheckOut ? formatDateTime(row.lastCheckOut) : '-'));
            tr.appendChild(cell('생성일', row.createdAt ?? '-')); // ✅ 추가
            tr.appendChild(cell('수정일', row.updatedAt ?? '-')); // ✅ 추가
            tr.appendChild(cell('작업', `<button data-id="${row.id}" class="btn btn--sm btn--primary">수정</button>`));
            tbody.appendChild(tr);
        }
    }

    function cell(label, value) {
        const td = document.createElement('td');
        td.dataset.th = label;
        td.innerHTML = value;
        return td;
    }

    // yyyy-MM-dd HH:mm:ss → 한국시간 포맷 함수
    function formatDateTime(str) {
        try {
            const d = new Date(str);
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        } catch {
            return str;
        }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
