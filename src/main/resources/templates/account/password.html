<!-- src/main/resources/templates/account/password.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="container">

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<h1>비밀번호 변경</h1>

<div class="wrap">
    <div class="card">
        <!-- 서버 측 메시지 표시 (선택적으로 model에 success / error 를 담아줄 수 있음) -->
        <div th:if="${success}" class="alert alert--ok" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert--error" th:text="${error}"></div>

        <form th:action="@{/account/password}" method="post" id="pwForm" novalidate>
            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label for="curPw">현재 비밀번호</label>
            <input id="curPw" name="currentPassword" type="password" class="input" autocomplete="current-password" required/>

            <label for="newPw">새 비밀번호</label>
            <input id="newPw" name="newPassword" type="password" class="input"
                   placeholder="영문/숫자 포함 8~64자"
                   minlength="8" maxlength="64" required/>

            <label for="newPw2">새 비밀번호 확인</label>
            <input id="newPw2" name="confirmPassword" type="password" class="input" required/>

            <div id="hint" class="alert alert--info">
                보안 권장: 8자 이상, 영문과 숫자를 포함하세요.
            </div>
            <div id="mismatch" class="alert alert--error" style="display:none;">새 비밀번호가 일치하지 않습니다.</div>
            <div id="weak" class="alert alert--error" style="display:none;">새 비밀번호가 보안 기준에 미달합니다.</div>

            <button class="btn btn--primary btn--block btn--lg" type="submit">변경하기</button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('pwForm');
    const newPw = document.getElementById('newPw');
    const newPw2 = document.getElementById('newPw2');
    const mismatch = document.getElementById('mismatch');
    const weak = document.getElementById('weak');

    function strongEnough(pw){
        // 영문 + 숫자 포함 8자 이상 간단 규칙
        return pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
    }

    function validate(){
        mismatch.style.display = (newPw.value && newPw2.value && newPw.value !== newPw2.value) ? 'block' : 'none';
        weak.style.display = (newPw.value && !strongEnough(newPw.value)) ? 'block' : 'none';
        return mismatch.style.display === 'none' && weak.style.display === 'none';
    }

    newPw.addEventListener('input', validate);
    newPw2.addEventListener('input', validate);

    form.addEventListener('submit', (e) => {
        if(!validate()){
            e.preventDefault();
            newPw2.focus();
        }
    });
</script>
</body>
</html>
