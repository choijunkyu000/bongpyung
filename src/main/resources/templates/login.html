<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>로그인</title>
    <style>
        :root{
            --bg:#f8fafc; --card:#ffffff; --border:#e5e7eb; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --error:#b91c1c;
        }
        @media (prefers-color-scheme: dark){
            :root{ --bg:#0b1220; --card:#0f172a; --border:#1f2a44; --text:#e5e7eb; --muted:#94a3b8; --primary:#3b82f6; --error:#f87171; }
        }
        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
            margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;
            background:var(--bg); color:var(--text);
            padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
            display:flex; align-items:center; justify-content:center;
        }
        .wrap{ width:100%; max-width:420px; }
        .logo{ text-align:center; margin-bottom:18px; font-weight:700; letter-spacing:.2px; }
        .card{
            background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 18px;
            box-shadow:0 6px 24px rgba(0,0,0,.06);
        }
        h1{ font-size:22px; margin:4px 0 14px; text-align:center; }
        label{ display:block; font-size:14px; color:var(--muted); margin:10px 2px 6px; }
        input{
            width:100%; height:48px; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
            background:transparent; color:var(--text); font-size:16px; outline:none;
        }
        input:focus{ border-color:var(--primary); box-shadow:0 0 0 4px color-mix(in oklab, var(--primary) 20%, transparent); }
        .btn{
            width:100%; height:52px; margin-top:14px; border:0; border-radius:12px; background:var(--primary);
            color:#fff; font-size:18px; font-weight:700;
        }
        .row{ display:flex; gap:10px; }
        .error, .info{
            font-size:14px; margin:8px 2px 0; line-height:1.4;
        }
        .error{ color:var(--error); }
        .info{ color:var(--muted); text-align:center; }
        .util{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
        .chk{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
        .link { font-size:14px; color:var(--primary); text-decoration:none; }
        /* 작은 기기에서 여백 살짝 축소 */
        @media (max-width:360px){
            .card{ padding:16px 14px; }
            .btn{ height:50px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo">봉편면옥 출퇴근 시스템</div>

    <div class="card">
        <h1>로그인</h1>

        <!-- 에러/로그아웃 메시지 -->
        <div th:if="${param.error}" class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="info" style="color:#16a34a">로그아웃되었습니다.</div>
        <div th:if="${param.expired}" class="info">세션이 만료되었습니다. 다시 로그인해주세요.</div>

        <form th:action="@{/login}" method="post" id="loginForm" novalidate>
            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label for="userId">아이디</label>
            <input id="userId" name="userId" type="text" autocomplete="username" placeholder="아이디" required />

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required />

            <div class="util">
                <!--
                <label class="chk">
                    <input type="checkbox" name="remember-me" style="width:18px;height:18px" />
                    로그인 유지
                </label>
                -->
                <!-- 필요하면 비밀번호 찾기 라우트 연결 -->
                <!-- <a class="link" href="/account/reset">비밀번호 찾기</a> -->
            </div>

            <button class="btn" type="submit">로그인</button>
            <!--<div class="info">보안을 위해 공용 기기에서는 로그아웃을 꼭 해주세요.</div>-->
        </form>
    </div>
</div>

<script>
    // 모바일에서 엔터로 전송 시 중복 제출 방지
    const form = document.getElementById('loginForm');
    let submitting = false;
    form.addEventListener('submit', (e) => {
        if (submitting) { e.preventDefault(); return; }
        submitting = true;
        // iOS 키보드 내려가도록 잠깐 포커스 해제
        document.activeElement && document.activeElement.blur();
    });

    // 사용자 편의: 처음 진입 시 아이디에 포커스
    window.addEventListener('DOMContentLoaded', () => {
        const u = document.getElementById('username');
        try { u.focus(); } catch(_) {}
    });
</script>
</body>
</html>
