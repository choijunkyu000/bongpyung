<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<h2>비밀번호 변경</h2>
<div th:if="${error}" th:text="${error}" style="color:red"></div>
<div th:if="${ok}">변경되었습니다.</div>
<form method="post">
    <div>현재 비밀번호: <input type="password" name="current"></div>
    <div>새 비밀번호: <input type="password" name="next"></div>
    <button type="submit">변경</button>
</form>
</body></html>
